# Alternative to Caddy: Nginx in front of the app on 127.0.0.1:3000.
# Three hosts point to the same app; the app separates them with the Host header.

# Customer site.
server {
    listen 80;
    server_name zav.baina.mn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zav.baina.mn;

    ssl_certificate     /etc/letsencrypt/live/zav.baina.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zav.baina.mn/privkey.pem;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # The proxy OVERWRITES these — never pass client values through.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

